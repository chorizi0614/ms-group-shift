<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

/* ===== TOKENS ===== */
:root{
  /* Store colors */
  --L:#5bcce8;   /* Linaria  水色 */
  --L-dim:rgba(91,204,232,.18);
  --M:#f040b0;   /* I's Melty ピンク */
  --M-dim:rgba(240,64,176,.18);
  --Y:#b0a8d0;   /* Lily Maid グレー */
  --Y-dim:rgba(176,168,208,.18);
  /* Page */
  --page:#07050d;
  --surface:#0d0b1a;
  --surface2:#131028;
  --border:rgba(255,255,255,.07);
  --border-pink:rgba(220,80,180,.13);
  --text:rgba(255,255,255,.90);
  --muted:rgba(255,255,255,.38);
  /* Day highlight */
  --today-bg:rgba(255,210,80,.11);
  --sat-bg:rgba(64,220,255,.07);
  --sun-bg:rgba(255,80,80,.08);
  --fri-bg:rgba(160,255,80,.06);
}

body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--page);
  color:var(--text);
  min-height:100dvh;
  overflow-x:hidden;
}

/* =====================================================
   HEADER
===================================================== */
header{
  position:sticky;
  top:0;
  z-index:200;
  background:var(--page);
}

/* — Logo band — */
.logo-band{
  background:linear-gradient(160deg,#0a0615 0%,#14092a 60%,#080516 100%);
  padding:5px 16px 6px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  border-bottom:1px solid var(--border-pink);
  position:relative;
  overflow:hidden;
}
.logo-band::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(240,64,176,.6),transparent);
}
/* Real logo (ms-logo.png — white pill background for dark bg) */
.ms-logo{
  height:34px;
  width:auto;
  display:block;
  margin:0;flex-shrink:0;
  object-fit:contain;
  background:rgba(255,255,255,.92);
  border-radius:8px;
  padding:4px 10px;
}
/* CSS fallback if image missing */
.ms-logo-fallback{
  display:none;
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:700;
  letter-spacing:6px;
  color:rgba(255,255,255,.92);
  margin-bottom:2px;
  line-height:1;
}
.logo-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.header-title{
  font-family:'Shippori Mincho B1',serif;
  font-size:13px;
  font-weight:400;
  letter-spacing:5px;
  color:rgba(255,255,255,.55);
  margin-top:0;
  white-space:nowrap;
}
.header-period{
  font-size:10px;
  letter-spacing:2px;
  color:rgba(200,130,255,.5);
  margin-top:2px;
  white-space:nowrap;
}

/* — Filter tabs — */
.filter-row{
  display:flex;
  background:#080614;
  padding:7px 10px;
  gap:6px;
  border-bottom:1px solid var(--border-pink);
}
.ftab{
  flex:1;
  padding:5px 4px;
  border:1.5px solid rgba(255,255,255,.11);
  border-radius:22px;
  font-size:10px;
  font-family:'Noto Sans JP',sans-serif;
  font-weight:700;
  background:rgba(255,255,255,.02);
  color:rgba(255,255,255,.4);
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  min-height:44px;
}
.ftab-logo{
  height:20px;width:auto;max-width:64px;
  object-fit:contain;
  filter:brightness(.78) saturate(.85);
  transition:filter .2s;
}
.ftab-name{
  font-size:9px;
  font-weight:700;
  letter-spacing:.5px;
  opacity:.6;
  line-height:1;
}
.ftab.is-all              {font-size:12px;font-weight:700}
.ftab.is-all.active       {background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.45);color:#fff}
.ftab.is-L                {border-color:rgba(91,204,232,.22);color:rgba(91,204,232,.6)}
.ftab.is-L.active         {background:var(--L-dim);border-color:var(--L);box-shadow:0 0 12px rgba(91,204,232,.18);color:var(--L)}
.ftab.is-L.active .ftab-logo {filter:brightness(1.1) saturate(1.2) drop-shadow(0 0 4px var(--L))}
.ftab.is-L.active .ftab-name {opacity:1}
.ftab.is-M                {border-color:rgba(240,64,176,.22);color:rgba(240,64,176,.6)}
.ftab.is-M.active         {background:var(--M-dim);border-color:var(--M);box-shadow:0 0 12px rgba(240,64,176,.18);color:var(--M)}
.ftab.is-M.active .ftab-logo {filter:brightness(1.1) saturate(1.2) drop-shadow(0 0 4px var(--M))}
.ftab.is-M.active .ftab-name {opacity:1}
.ftab.is-Y                {border-color:rgba(176,168,208,.22);color:rgba(176,168,208,.6)}
.ftab.is-Y .ftab-logo     {filter:brightness(0) invert(1) opacity(.65)}
.ftab.is-Y.active         {background:var(--Y-dim);border-color:var(--Y);box-shadow:0 0 12px rgba(176,168,208,.18);color:var(--Y)}
.ftab.is-Y.active .ftab-logo {filter:brightness(0) invert(1) drop-shadow(0 0 4px var(--Y))}
.ftab.is-Y.active .ftab-name {opacity:1}

/* — Period nav — */
.nav-row{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#070510;
  padding:6px 12px;
  gap:16px;
  border-bottom:1px solid rgba(200,80,200,.09);
}
.nav-btn{
  width:36px;height:36px;
  border:1px solid rgba(240,64,176,.22);
  border-radius:50%;
  background:rgba(240,64,176,.05);
  color:rgba(255,200,240,.8);
  font-size:22px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
  flex-shrink:0;
}
.nav-btn:active{background:rgba(240,64,176,.18)}
#navLabel{
  font-size:14px;font-weight:700;
  color:rgba(255,230,255,.88);
  letter-spacing:1px;
  min-width:130px;text-align:center;
}

/* =====================================================
   TODAY PANEL
===================================================== */
.today-panel{
  display:none;
  background:linear-gradient(180deg,rgba(240,64,176,.07) 0%,transparent 100%);
  border-bottom:1px solid rgba(240,64,176,.14);
  padding:10px 12px 11px;
}
.today-panel.visible{display:block}
.today-head{
  font-size:10px;font-weight:700;
  letter-spacing:2px;
  color:rgba(255,160,220,.75);
  margin-bottom:8px;
  display:flex;align-items:center;gap:5px;
}
.today-head::before{content:'♡';font-size:13px;color:rgba(240,80,180,.7)}
.today-chips{
  display:flex;gap:7px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:2px;
  scrollbar-width:none;
}
.today-chips::-webkit-scrollbar{display:none}
.tc{
  display:inline-flex;align-items:center;
  gap:6px;
  background:var(--surface2);
  border-radius:24px;
  padding:5px 11px 5px 5px;
  white-space:nowrap;flex-shrink:0;
}
.tc.tc-L{border:1.5px solid rgba(91,204,232,.35);background:rgba(91,204,232,.07)}
.tc.tc-M{border:1.5px solid rgba(240,64,176,.35);background:rgba(240,64,176,.07)}
.tc.tc-Y{border:1.5px solid rgba(176,168,208,.35);background:rgba(176,168,208,.07)}
.tc-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(255,255,255,.2)}
.tc-nophoto{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.09);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.12)}
.tc-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.92)}
.tc-name a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.tc-name a::after{content:'𝕏';font-size:9px;opacity:.45;flex-shrink:0}
.tc-name a:hover{opacity:.8}
.tc-time{font-size:10px;color:rgba(255,255,255,.42);margin-left:1px}
.tc-slogo{height:14px;width:auto;max-width:36px;object-fit:contain;opacity:.6;flex-shrink:0}

/* =====================================================
   STATUS BAR
===================================================== */
.status-bar{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  min-height:26px;
}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sdot.ok{background:#4caf50}
.sdot.ld{background:#2196f3;animation:blink .9s infinite}
.sdot.err{background:#f44336}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#stxt{font-size:10px;color:var(--muted)}
#supdated{font-size:10px;color:var(--muted);margin-left:auto;opacity:.5}
.tap-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:700;color:rgba(255,180,225,.9);background:rgba(240,64,176,.07);border-bottom:1px solid var(--border);padding:4px 12px}
.tap-hint b{color:#ffc7ec}
.tap-hint .th-x{background:none;border:0;color:rgba(255,180,225,.7);font-size:14px;line-height:1;cursor:pointer;padding:0 2px;margin-left:2px}

/* =====================================================
   SHIFT TABLE
===================================================== */
.table-wrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);
}
.table-wrap::-webkit-scrollbar{height:3px}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
table{border-collapse:collapse;white-space:nowrap;width:100%}

/* Sticky name column */
thead th:first-child,
tbody td:first-child{
  position:sticky;left:0;z-index:10;
  background:var(--surface);
}
thead th:first-child{background:#0d0b1a;z-index:11}

/* Header rows */
thead th{padding:0;border-bottom:1px solid var(--border);font-weight:400}
#dRow th:first-child{
  min-width:92px;max-width:92px;
  padding:0 4px;font-size:11px;font-weight:700;color:var(--muted);
  vertical-align:middle;border-right:1px solid rgba(200,80,200,.12);
  text-align:center;height:26px;
}
#wRow th:first-child{border-right:1px solid rgba(200,80,200,.12);height:18px}

/* JS sticky date header */
#stickyDates{
  position:fixed;left:0;right:0;z-index:150;
  background:#0d0b1a;
  border-bottom:1px solid rgba(255,255,255,.07);
  display:none;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  pointer-events:none;
}
#stickyDates::-webkit-scrollbar{display:none}
#stickyDates table{border-collapse:collapse;white-space:nowrap;table-layout:fixed}
#stickyDates thead th:first-child{position:sticky;left:0;z-index:12;background:#0d0b1a}
#stickyDates .th-d,#stickyDates .th-w{pointer-events:none}

.th-date{min-width:38px;width:38px}
.th-d{height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.62)}
.th-w{height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,.42)}

/* Column colors */
.col-sun .th-d,.col-sun .th-w{color:rgba(255,100,100,.8)}
.col-sat .th-d,.col-sat .th-w{color:rgba(64,220,255,.85)}
.col-fri .th-d,.col-fri .th-w{color:rgba(160,255,80,.7)}
.col-today .th-d{color:#fff;font-weight:700}
.col-today .th-d > span{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,210,80,.28);border:1px solid rgba(255,210,80,.55);
}
/* Event day column — 数字＋下ドット（当日の丸バッジと混同しない） */
.col-event .th-d{color:#ffe066;font-weight:700;flex-direction:column;gap:0}
.col-event .th-d > .ev-badge{line-height:1}
.col-event .th-d > .ev-badge::after{
  content:'';display:block;
  width:5px;height:5px;border-radius:50%;
  background:#ffe066;box-shadow:0 0 4px rgba(255,220,0,.7);
  margin:2px auto 0;
}
.ev-label{
  display:block;font-size:7px;line-height:1.2;margin-top:2px;
  color:rgba(255,120,220,.9);text-align:center;
  overflow:hidden;white-space:nowrap;max-width:36px;
}
body.compact .ev-label{display:none}
.wk-sep{border-left:2px solid rgba(140,90,255,.28)!important}

/* Body rows */
tbody tr{border-bottom:1px solid rgba(255,255,255,.06);transition:opacity .15s}
tbody tr.rh{display:none}
tbody td:first-child{
  padding:0 6px 0 8px;
  font-size:12px;font-weight:500;
  color:rgba(255,230,255,.88);
  height:42px;min-width:92px;max-width:92px;
  overflow:hidden;border-right:1px solid rgba(200,80,200,.1);
}
tbody td{padding:2px 1px;text-align:center;vertical-align:middle;height:42px}

/* Cast name cell */
.cast-cell{display:flex;align-items:center;gap:4px;overflow:hidden}
.c-photo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(240,64,176,.28)}
.c-nophoto{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.09);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.12)}
.c-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.c-name a{color:#ffc7ec;text-decoration:underline dotted rgba(240,64,176,.5);text-underline-offset:2px;display:inline-flex;align-items:center;gap:3px}
.c-name a::after{content:'𝕏';font-size:8px;opacity:.6;flex-shrink:0}
.c-name a:hover{opacity:.8}
.c-name a:hover::after{opacity:.8}

/* Day highlight — 当日のみ背景あり */
tbody td.cd-today{background:var(--today-bg)}

/* Shift badge */
.shift{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:14px;padding:3px 6px;
  font-size:9.5px;font-weight:700;
  white-space:nowrap;min-width:32px;
  letter-spacing:0;
}
.shift.dm{opacity:.14}
.shift-L{background:rgba(91,204,232,.16);color:var(--L);border:1px solid rgba(91,204,232,.52)}
.shift-M{background:rgba(240,64,176,.16);color:var(--M);border:1px solid rgba(240,64,176,.52)}
.shift-Y{background:rgba(176,168,208,.16);color:var(--Y);border:1px solid rgba(176,168,208,.52)}

/* =====================================================
   BOTTOM
===================================================== */
.bottom-section{
  padding:16px 14px 36px;
  background:var(--surface);
  border-top:1px solid rgba(200,80,200,.1);
  display:flex;flex-direction:column;gap:16px;
}
.ev-card{
  background:var(--surface2);
  border:1px solid rgba(200,80,200,.1);
  border-radius:14px;
  padding:14px 16px;
}
.ev-head{
  font-family:'Shippori Mincho B1',serif;
  font-size:13px;font-weight:700;
  color:rgba(220,140,255,.75);
  margin-bottom:10px;letter-spacing:2px;
}
#evList{list-style:none;display:flex;flex-direction:column;gap:6px}
#evList li{font-size:12px;color:var(--text);display:flex;gap:8px;align-items:baseline}
.ev-date{color:rgba(240,140,255,.75);font-size:11px;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lg-item{
  display:flex;align-items:center;padding:6px 12px;
  border-radius:20px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
}
.lg-item.lg-L{border-color:rgba(91,204,232,.22)}
.lg-item.lg-M{border-color:rgba(240,64,176,.22)}
.lg-item.lg-Y{border-color:rgba(176,168,208,.22)}
.lg-logo{height:20px;width:auto;max-width:70px;object-fit:contain;filter:brightness(.9)}
.lg-item.lg-Y .lg-logo{filter:brightness(0) invert(1) opacity(.8)}

/* =====================================================
   COMPACT MODE
===================================================== */
.cmp-btn{
  position:fixed;bottom:20px;right:16px;z-index:300;
  display:flex;align-items:center;gap:5px;
  padding:7px 13px 7px 10px;
  border-radius:22px;
  background:rgba(20,10,36,.9);
  border:1.5px solid rgba(240,64,176,.35);
  color:rgba(255,200,240,.8);
  font-size:11px;font-weight:700;
  cursor:pointer;
  box-shadow:0 2px 14px rgba(0,0,0,.4);
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(8px);
  transition:all .15s;
}
.cmp-btn:active{background:rgba(240,64,176,.25)}
.cmp-btn.on{border-color:rgba(240,64,176,.75);background:rgba(240,64,176,.15);color:#fff}
.cmp-btn .cmp-icon{font-size:13px;line-height:1}

/* Compact mode overrides */
body.compact tbody td:first-child{min-width:58px;max-width:58px;padding:0 3px 0 6px}
body.compact .c-photo,body.compact .c-nophoto{display:none}
body.compact .c-name{font-size:10px;font-weight:700}
body.compact .cast-cell{justify-content:flex-start}
body.compact .th-date{min-width:28px;width:28px}
body.compact .th-d{font-size:9.5px;height:20px}
body.compact .th-w{font-size:8px;height:13px}
body.compact #dRow th:first-child{min-width:58px;max-width:58px;height:20px}
body.compact #wRow th:first-child{height:13px}
body.compact tbody td{height:27px;padding:1px 0}
body.compact tbody td:first-child{height:27px}
body.compact .shift{font-size:7.5px;padding:2px 3px;min-width:22px;border-radius:7px;letter-spacing:-.3px}

/* =====================================================
   DESKTOP
===================================================== */
@media(min-width:640px){
  .logo-band{padding:7px 20px 8px}
  .ms-logo{height:42px}
  .header-title{font-size:14px;letter-spacing:6px}
  .filter-row{padding:8px 16px;gap:8px}
  .ftab{min-height:48px}
  .ftab-logo{height:24px;max-width:78px}
  .ftab.is-all{font-size:13px}
  .ftab-name{font-size:10px}
  #navLabel{font-size:15px}
  .th-date{min-width:44px;width:44px}
  .th-d{font-size:13px;height:28px}
  .th-w{font-size:10px;height:20px}
  #dRow th:first-child{min-width:95px;max-width:95px;height:28px}
  #wRow th:first-child{height:20px}
  tbody td:first-child{min-width:95px;max-width:95px;height:46px}
  tbody td{height:46px}
  .c-photo,.c-nophoto{width:30px;height:30px}
  .c-name{font-size:13px}
  .shift{font-size:11px;padding:3px 7px;min-width:38px}
  .tc-photo,.tc-nophoto{width:40px;height:40px}
  .tc-name{font-size:14px}
  .bottom-section{flex-direction:row;flex-wrap:wrap}
  .ev-card{flex:1;min-width:260px}
  .legend{flex:1;justify-content:flex-end}

/* =====================================================
   STATE
===================================================== */
const WD   = ['日','月','火','水','木','金','土'];
const MO_J = ['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let curPeriod, activeFilter='all';

function detectPeriod(){const n=new Date();return{y:n.getFullYear(),m:n.getMonth()+1,h:n.getDate()<=15?1:2}}
function periodKey(p){return p.y+'-'+p.m}
function periodLabel(p){return MO_J[p.m]+(p.h===1?' 前半（1〜15日）':' 後半（16〜末日）')}
function navLabel(p){return p.y+'/'+String(p.m).padStart(2,'0')+(p.h===1?' 前半':' 後半')}
function go(d){
  let{y,m,h}=curPeriod; h+=d;
  if(h>2){h=1;m++} if(h<1){h=2;m--}
  if(m>12){m=1;y++} if(m<1){m=12;y--}
  curPeriod={y,m,h}; loadAndRender(curPeriod);
}

/* =====================================================
   LOADER
===================================================== */
async function loadSheet(key){
  const[y,mo]=key.split('-');
  const month=y+'-'+mo.padStart(2,'0');
  const r=await fetch(CONFIG.PHP_URL+'?month='+month);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const data=await r.json();
  if(!Array.isArray(data)) throw new Error('invalid');
  return data;
}

function setStatus(cls,txt){
  document.getElementById('sdot').className='sdot '+cls;
  document.getElementById('stxt').textContent=txt;
  if(cls==='ok'){
    const n=new Date();
    document.getElementById('supdated').textContent=
      '更新 '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  }
}

/* =====================================================
   TODAY PANEL
===================================================== */
function renderToday(allRows){
  const panel=document.getElementById('todayPanel');
  const chips=document.getElementById('todayChips');
  const now=new Date();
  const{y:py,m:pm}=curPeriod;
  if(now.getFullYear()!==py||now.getMonth()+1!==pm){panel.classList.remove('visible');return}
  const d=now.getDate();
  const today=allRows.filter(r=>r[1]===d);
  if(!today.length){panel.classList.remove('visible');return}
  chips.innerHTML='';
  const ORD={L:0,M:1,Y:2};
  today.sort((a,b)=>(ORD[a[2]]??9)-(ORD[b[2]]??9)||a[0].localeCompare(b[0],'ja'));
  today.forEach(([name,,store,time,photo,xid])=>{
    const chip=document.createElement('div');
    chip.className='tc tc-'+store;
    const initial=name.charAt(0);
    const img=photo
      ?`<img class="tc-photo" src="${CONFIG.PHOTO_BASE}${photo}" alt="${name}" onerror="this.outerHTML='<span class=\\'tc-nophoto\\'>${initial}</span>'">`
      :`<span class="tc-nophoto">${initial}</span>`;
    const nm=xid
      ?`<span class="tc-name"><a href="https://x.com/${xid}" target="_blank" rel="noopener">${name}</a></span>`
      :`<span class="tc-name">${name}</span>`;
    const slogo=CONFIG.STORE_LOGO[store]
      ?`<img class="tc-slogo" src="${CONFIG.STORE_LOGO[store]}" alt="" onerror="this.style.display='none'">`:'';
    chip.innerHTML=img+nm+`<span class="tc-time">${time}</span>`+slogo;
    chips.appendChild(chip);
  });
  panel.classList.add('visible');
}

/* =====================================================
   RENDER TABLE
===================================================== */
function render(period, allRows){
  const{y,m,h}=period;
  const daysInMonth=new Date(y,m,0).getDate();
  const startDay=h===1?1:16, endDay=h===1?15:daysInMonth;
  const todayD=(()=>{const n=new Date();return(n.getFullYear()===y&&n.getMonth()+1===m)?n.getDate():-1})();

  document.getElementById('titlePeriod').textContent=periodLabel(period);
  document.getElementById('navLabel').textContent=navLabel(period);
  document.title=MO_J[m]+(h===1?'前半':'後半')+' お給仕予定 | MS Group';

  const rows=allRows.filter(([,day])=>day>=startDay&&day<=endDay);

  /* ── Date header ── */
  const dRow=document.getElementById('dRow');
  const wRow=document.getElementById('wRow');
  while(dRow.children.length>1) dRow.removeChild(dRow.lastChild);
  wRow.innerHTML='<th></th>';

  // Build event-day map for this period
  const evDayMap=new Map();
  ((CONFIG.EVENTS_BY_MONTH||{})[periodKey(period)]||[]).forEach(ev=>{
    const mm=ev.date.match(/\d+月(\d+)日/); if(mm) evDayMap.set(+mm[1],ev.text);
  });
  let evBodyCSS='', colIdx=2;

  for(let d=startDay;d<=endDay;d++){
    const w=new Date(y,m-1,d).getDay();
    const isT=d===todayD, isMon=w===1;
    const isEv=!isT&&evDayMap.has(d);
    const hol=window.HOL&&window.HOL[y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')];
    const col=isT?' col-today':isEv?' col-event':(hol||w===0)?' col-sun':w===6?' col-sat':w===5?' col-fri':'';
    const sep=(isMon&&d>startDay)?' wk-sep':'';
    const th1=document.createElement('th');
    th1.className='th-date'+col+sep;
    let dayInner;
    if(isT) dayInner=`<span>${d}</span>`;
    else if(isEv){
      dayInner=`<span class="ev-badge">${d}</span>`;
      evBodyCSS+=`#tBody td:nth-child(${colIdx}){background:rgba(255,210,0,.05)!important}`;
    }else dayInner=d;
    th1.innerHTML=`<div class="th-d">${dayInner}</div>`;
    dRow.appendChild(th1);
    const th2=document.createElement('th');
    th2.className=col+sep;
    th2.innerHTML='<div class="th-w">'+WD[w]+'</div>';
    wRow.appendChild(th2);
    colIdx++;
  }
  // Inject event-column body highlight
  let es=document.getElementById('evColStyle');
  if(!es){es=document.createElement('style');es.id='evColStyle';document.head.appendChild(es);}
  es.textContent=evBodyCSS;

  /* ── Body ── */
  const tbody=document.getElementById('tBody');
  tbody.innerHTML='';
  const order=[], map=new Map(), meta={};
  rows.forEach(([name,day,store,time,photo,xid])=>{
    if(!map.has(name)){order.push(name);map.set(name,[])}
    map.get(name).push({day,store,time});
    if(!meta[name]) meta[name]={photo:photo||'',xid:xid||''};
  });

  order.sort((a,b)=>a.localeCompare(b,'ja'));
  order.forEach(name=>{
    const shifts=map.get(name);
    const stores=[...new Set(shifts.map(s=>s.store))];
    const tr=document.createElement('tr');
    tr.dataset.stores=stores.join(',');

    /* Name cell */
    const{photo,xid}=meta[name]||{};
    const nameTd=document.createElement('td');
    const initial=name.charAt(0);
    const img=photo
      ?`<img class="c-photo" src="${CONFIG.PHOTO_BASE}${photo}" alt="${name}" onerror="this.outerHTML='<span class=\\'c-nophoto\\'>${initial}</span>'">`
      :`<span class="c-nophoto">${initial}</span>`;
    const nm=xid
      ?`<span class="c-name"><a href="https://x.com/${xid}" target="_blank" rel="noopener">${name}</a></span>`
      :`<span class="c-name">${name}</span>`;
    nameTd.innerHTML=`<span class="cast-cell">${img}${nm}</span>`;
    tr.appendChild(nameTd);

    const dayMap={};
    shifts.forEach(s=>{dayMap[s.day]=s});

    for(let d=startDay;d<=endDay;d++){
      const w=new Date(y,m-1,d).getDay();
      const isT=d===todayD, isMon=w===1;
      const hol=window.HOL&&window.HOL[y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')];
      const td=document.createElement('td');
      const rc=isT?'cd-today':(hol||w===0)?'cd-sun':w===5?'cd-fri':w===6?'cd-sat':'';
      if(rc) td.className=rc;
      if(isMon&&d>startDay) td.classList.add('wk-sep');
      if(dayMap[d]){
        const s=dayMap[d];
        const sp=document.createElement('span');
        sp.className='shift shift-'+s.store;
        sp.dataset.store=s.store;
        sp.textContent=s.time;
        td.appendChild(sp);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });

  /* ── Events ── */
  const evList=document.getElementById('evList');
  evList.innerHTML='';
  const allEvs=(CONFIG.EVENTS_BY_MONTH||{})[periodKey(period)]||[];
  // 前半(h=1):1〜15日 / 後半(h=2):16日〜 でフィルタ
  const evs=allEvs.filter(ev=>{
    const mm=ev.date.match(/\d+月(\d+)日/);
    if(!mm) return true;
    const d=+mm[1];
    return period.h===1 ? d<=15 : d>15;
  });
  if(!evs.length){
    evList.innerHTML='<li style="color:rgba(255,255,255,.22);font-size:11px">イベントなし</li>';
  } else {
    evs.forEach(({date,text})=>{
      const li=document.createElement('li');
      li.innerHTML=`<span class="ev-date">${date}</span>${text}`;
      evList.appendChild(li);
    });
  }

  applyFilter(activeFilter);
}

/* =====================================================
   FILTER
===================================================== */
function applyFilter(store){
  document.querySelectorAll('#tBody tr').forEach(tr=>{
    if(store==='all'){
      tr.classList.remove('rh');
      tr.querySelectorAll('.shift').forEach(s=>s.classList.remove('dm'));
    } else {
      const ss=tr.dataset.stores?tr.dataset.stores.split(','):[];
      ss.includes(store)?tr.classList.remove('rh'):tr.classList.add('rh');
      tr.querySelectorAll('.shift').forEach(s=>s.dataset.store===store?s.classList.remove('dm'):s.classList.add('dm'));
    }
  });
}
function setFilter(store,btn){
  activeFilter=store;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  applyFilter(store);
}

/* =====================================================
   LOAD + RENDER
===================================================== */
async function loadEvents(period){
  try{
    const[y,mo]=periodKey(period).split('-');
    const month=y+'-'+mo.padStart(2,'0');
    const r=await fetch(CONFIG.EVENTS_URL+'?month='+month,{cache:'no-store'});
    if(!r.ok) return;
    const data=await r.json();
    if(Array.isArray(data)) CONFIG.EVENTS_BY_MONTH[periodKey(period)]=data;
  }catch(e){ console.warn('events fetch',e); }
}

async function loadAndRender(period){
  setStatus('ld','読み込み中…');
  const key=periodKey(period);
  location.hash=period.y+'-'+period.m+'-'+period.h;
  await loadEvents(period);
  try{
    const rows=await loadSheet(key);
    render(period,rows);
    renderToday(rows);
    setStatus('ok','シフト反映済み');
  } catch(e){
    console.warn(e);
    const sample=SAMPLE[key]||[];
    render(period,sample);
    renderToday(sample);
    setStatus('err','サンプルデータ表示中');
  }
}

/* =====================================================
   STICKY DATE HEADER (JS-driven, flicker-free)
===================================================== */
(function(){
  const sticky=document.createElement('div');
  sticky.id='stickyDates';
  document.body.insertBefore(sticky,document.body.firstChild);

  let built=false, widthsSynced=false, ticking=false, visible=false;
  const GAP=5; // px hysteresis to prevent boundary flicker

  // Always reference the ORIGINAL rows (not clones) to avoid id collision
  function getOrigDRow(){ return document.querySelector('.table-wrap #dRow'); }

  function build(){
    const dRow=getOrigDRow();
    const wRow=document.querySelector('.table-wrap #wRow');
    if(!dRow||!wRow) return;
    const tbl=document.createElement('table');
    tbl.style.cssText='border-collapse:collapse;white-space:nowrap;table-layout:fixed';
    const head=document.createElement('thead');
    const cloneDRow=dRow.cloneNode(true);
    const cloneWRow=wRow.cloneNode(true);
    cloneDRow.removeAttribute('id'); // prevent id collision
    cloneWRow.removeAttribute('id');
    head.appendChild(cloneDRow);
    head.appendChild(cloneWRow);
    tbl.appendChild(head);
    sticky.innerHTML='';
    sticky.appendChild(tbl);
    built=true; widthsSynced=false;
  }

  function syncWidths(){
    if(widthsSynced) return;
    const origRow=getOrigDRow();
    if(!origRow||!built) return;
    const origThs=origRow.querySelectorAll('th');
    const cloneThs=sticky.querySelectorAll('tr:first-child th');
    let total=0;
    origThs.forEach((th,i)=>{
      const w=th.getBoundingClientRect().width;
      if(cloneThs[i]) cloneThs[i].style.width=w+'px';
      total+=w;
    });
    const tbl=sticky.querySelector('table');
    if(tbl&&total>0){tbl.style.width=total+'px'; widthsSynced=true;}
  }

  function syncScroll(){
    if(!built) return;
    const tw=document.querySelector('.table-wrap');
    if(tw) sticky.scrollLeft=tw.scrollLeft;
  }

  function update(){
    ticking=false;
    const hdr=document.querySelector('header');
    const dRow=getOrigDRow();
    if(!hdr||!dRow) return;
    const headerH=hdr.offsetHeight;
    const top=dRow.getBoundingClientRect().top;

    if(!visible && top<headerH-GAP){
      // Show sticky
      if(!built) build();
      sticky.style.top=headerH+'px';
      sticky.style.display='block';
      visible=true;
      syncWidths();
      syncScroll();
    } else if(visible && top>headerH+GAP){
      // Hide sticky
      sticky.style.display='none';
      visible=false;
    } else if(visible){
      syncScroll();
    }
  }

  function onScroll(){
    if(!ticking){requestAnimationFrame(update);ticking=true;}
  }

  function onResize(){
    built=false; widthsSynced=false; visible=false;
    sticky.style.display='none';
    requestAnimationFrame(update);
  }

  function attachTW(){
    const tw=document.querySelector('.table-wrap');
    if(tw) tw.addEventListener('scroll',syncScroll,{passive:true});
  }

  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onResize);
  attachTW();

  document.addEventListener('click',e=>{
    if(e.target.closest('.nav-btn')){
      setTimeout(()=>{built=false;widthsSynced=false;attachTW();update();},450);
    }
  });
})();
</script>

    if(inApp && localStorage.getItem('msExtBannerHide')!=='1'){
      var b=document.createElement('div'); b.id='extBanner';
      b.innerHTML='<span class="eb-txt">📱 ブラウザで開くともっと見やすいよ（右上［•••］→ブラウザで開く）</span>'
        +'<button class="eb-open">開く</button><span class="eb-x">✕</span>';
      document.body.appendChild(b);
      requestAnimationFrame(function(){
        b.classList.add('show'); document.body.style.paddingTop=b.offsetHeight+'px';
        if(window.__fitShift)window.__fitShift();
      });
      setTimeout(function(){ b.classList.add('hide'); document.body.style.paddingTop=''; if(window.__fitShift)window.__fitShift(); },8000);
      b.querySelector('.eb-open').onclick=function(){
        try{ navigator.clipboard && navigator.clipboard.writeText(location.href); }catch(e){}
        window.open(location.href,'_blank');
        alert('URLをコピーしました。Safari / Chrome に貼り付けて開くと見やすいです。\n（右上メニューの「ブラウザで開く」でもOK）');
      };
      b.querySelector('.eb-x').onclick=function(){ b.classList.remove('show'); document.body.style.paddingTop=''; try{localStorage.setItem('msExtBannerHide','1');}catch(e){} if(window.__fitShift)window.__fitShift(); };
    }
  }catch(e){}
})();
</script>

<script>
/* =====================================================
   📷 画像保存 — 編集サイト(edit.php)と同じ Canvas 直接描画方式
   （html2canvasは使わない＝確実に動く）
===================================================== */
(function(){
  var SNAME={L:"Linaria",M:"I's Melty",Y:"Lily Maid"};
  var COL  ={L:'#bdf0f2',M:'#fbcdf3',Y:'#e6e6ea'};
  var EDGE ={L:'#3ec3ca',M:'#e061c9',Y:'#9a9aa4'};
  var FONT ='"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';

  /* 画面の表から書き出し用データを取り出す */
  function collect(){
    var days=[], ths=document.querySelectorAll('.table-wrap #dRow th'), ws=document.querySelectorAll('.table-wrap #wRow th');
    for(var i=1;i<ths.length;i++){
      var th=ths[i], cl=th.className||'';
      days.push({d:(th.textContent||'').trim(), wd:((ws[i]||{}).textContent||'').trim(),
                 sun:/col-sun/.test(cl), sat:/col-sat/.test(cl), today:/col-today/.test(cl), ev:/col-event/.test(cl)});
    }
    var rows=[];
    document.querySelectorAll('#tBody tr').forEach(function(tr){
      if(tr.classList.contains('rh')) return;                 // 店舗フィルタで隠れている行は出さない
      var tds=tr.querySelectorAll('td');
      var nm=(tr.querySelector('.c-name')||{}).textContent||'';
      var cells=[];
      var any=false;
      for(var i=1;i<tds.length;i++){
        var sp=tds[i].querySelector('.shift:not(.dm)');       // 絞り込みで薄くなっているものは除外
        if(sp){ cells.push({store:(sp.dataset.store||''),t:(sp.textContent||'').trim()}); any=true; }
        else cells.push(null);
      }
      if(any) rows.push({name:nm.trim(),cells:cells});
    });
    return {days:days, rows:rows};
  }

  window.saveImage=function(){
    var btn=document.getElementById('saveImgBtn'), label=btn?btn.innerHTML:'';
    try{
      var D=collect();
      if(!D.rows.length){ alert('表示中のシフトがありません。'); return; }
      if(btn){ btn.disabled=true; btn.innerHTML='作成中…'; }
      var SC=2,M=22,PAD=10,NW=118,CW=70,RH=40,HH=46,BAN=62,LH=52;
      var gridW=NW+CW*D.days.length;
      var W=M*2+PAD*2+gridW;
      var cardH=PAD*2+HH+RH*D.rows.length;
      var evN=document.querySelectorAll('#evList li').length;
      var evH=evN?(20+Math.ceil(evN/2)*16+10):0;
      var H=M+BAN+14+cardH+LH+evH+M/2;
      var cv=document.createElement('canvas'); cv.width=W*SC; cv.height=H*SC;
      var g=cv.getContext('2d'); g.scale(SC,SC);
      function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
        g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
      var bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#faf6ff'); bg.addColorStop(1,'#f1e9f8');
      g.fillStyle=bg; g.fillRect(0,0,W,H);
      var bn=g.createLinearGradient(M,0,W-M,0); bn.addColorStop(0,'#7b5ea7'); bn.addColorStop(1,'#a86bc9');
      g.save(); g.shadowColor='rgba(90,60,130,.25)'; g.shadowBlur=10; g.shadowOffsetY=2;
      rr(M,M,W-M*2,BAN,14); g.fillStyle=bn; g.fill(); g.restore();
      g.textBaseline='middle'; g.textAlign='left'; g.fillStyle='#fff'; g.font='bold 20px '+FONT;
      g.fillText("🗓 M's GROUP お給仕予定", M+22, M+BAN/2-10);
      var per=((document.getElementById('navLabel')||{}).textContent||'').trim();
      g.font='12px '+FONT; g.globalAlpha=.92;
      g.fillText(per+"   Linaria ・ I's Melty ・ Lily Maid", M+22, M+BAN/2+13); g.globalAlpha=1;
      var cy0=M+BAN+14;
      g.save(); g.shadowColor='rgba(90,60,130,.16)'; g.shadowBlur=14; g.shadowOffsetY=3;
      rr(M,cy0,W-M*2,cardH,14); g.fillStyle='#fff'; g.fill(); g.restore();
      var gx=M+PAD, gy=cy0+PAD;
      rr(gx,gy,gridW,HH,10); g.fillStyle='#f3edf9'; g.fill();
      g.textAlign='center';
      D.days.forEach(function(d,i){
        var cx=gx+NW+CW*i+CW/2;
        g.fillStyle=d.sun?'#d93025':d.sat?'#2864c7':d.today?'#c88a10':'#4a4257';
        g.font='bold 15px '+FONT; g.fillText(d.d,cx,gy+16);
        g.font='10px '+FONT; g.globalAlpha=.75; g.fillText('('+d.wd+')',cx,gy+32); g.globalAlpha=1;
      });
      g.fillStyle='#7b5ea7'; g.font='bold 13px '+FONT; g.textAlign='left';
      g.fillText('キャスト',gx+12,gy+HH/2);
      D.rows.forEach(function(rw,r){
        var cy=gy+HH+RH*r;
        if(r%2===1){ g.fillStyle='#faf7fd'; g.fillRect(gx,cy,gridW,RH); }
        g.strokeStyle='#f0eaf6'; g.lineWidth=1; g.beginPath(); g.moveTo(gx,cy); g.lineTo(gx+gridW,cy); g.stroke();
        g.fillStyle='#4a4257'; g.font='bold 13px '+FONT; g.textAlign='left';
        g.fillText(rw.name,gx+12,cy+RH/2);
        rw.cells.forEach(function(c,i){
          if(!c) return;
          var cx=gx+NW+CW*i;
          rr(cx+3,cy+4,CW-6,RH-8,8);
          g.fillStyle=COL[c.store]||'#eee'; g.fill();
          g.strokeStyle=EDGE[c.store]||'#bbb'; g.lineWidth=1.2; g.stroke();
          g.fillStyle='#3a3340'; g.font='bold 12px '+FONT; g.textAlign='center';
          g.fillText(c.t,cx+CW/2,cy+RH/2);
        });
      });
      var lx=M+PAD, ly=cy0+cardH+16;
      g.textAlign='left'; g.font='bold 12px '+FONT;
      ['L','M','Y'].forEach(function(st){
        var tw=g.measureText(SNAME[st]).width;
        rr(lx,ly,tw+34,22,11); g.fillStyle=COL[st]; g.fill();
        g.strokeStyle=EDGE[st]; g.lineWidth=1.2; g.stroke();
        g.fillStyle='#3a3340'; g.fillText(SNAME[st],lx+17,ly+11);
        lx+=tw+34+12;
      });
      g.font='11px '+FONT; g.fillStyle='#8a7f96'; g.textAlign='right';
      g.fillText('時間は 出勤-退勤(L=ラスト) / 変更になる場合があります', W-M-PAD, ly+11);
      /* イベント情報（ポスター風に画像へも載せる） */
      var evs=[].slice.call(document.querySelectorAll('#evList li')).map(function(li){
        var d=li.querySelector('.ev-date'); var dt=d?d.textContent.trim():'';
        return {d:dt, t:li.textContent.replace(dt,'').trim()};
      }).filter(function(x){return x.t && x.t.indexOf('イベントなし')<0;});
      if(evs.length){
        var ey=ly+34, colW=(W-M*2-PAD*2)/2, perCol=Math.ceil(evs.length/2);
        g.textAlign='left'; g.font='bold 12px '+FONT; g.fillStyle='#a24fc8';
        g.fillText('🎀 イベント情報', M+PAD, ey);
        evs.forEach(function(ev,i){
          var col=Math.floor(i/perCol), row=i%perCol;
          var x=M+PAD+col*colW, y=ey+20+row*16;
          g.font='bold 11px '+FONT; g.fillStyle='#b24d88'; g.fillText(ev.d, x, y);
          g.font='11px '+FONT; g.fillStyle='#4a4257'; g.fillText(ev.t, x+62, y);
        });
      }

      var name='お給仕予定_'+per.replace(/[ \/]/g,'')+'.png';
      var done=function(){ if(btn){btn.disabled=false;btn.innerHTML=label;} };
      var fallback=function(blob){
        var u=blob?URL.createObjectURL(blob):cv.toDataURL('image/png');
        var a=document.createElement('a'); a.href=u; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        if(blob) setTimeout(function(){URL.revokeObjectURL(u);},8000);
        done();
      };
      if(cv.toBlob){
        cv.toBlob(function(b){
          if(!b){ fallback(null); return; }
          /* iPhone/Android: 共有シートから「画像を保存」→ 写真フォルダに入る */
          try{
            var file=new File([b],name,{type:'image/png'});
            if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
              navigator.share({files:[file],title:'お給仕予定'})
                .then(done)
                .catch(function(err){ if(err&&err.name==='AbortError'){done();} else {fallback(b);} });
              return;
            }
          }catch(_){}
          fallback(b);
        },'image/png');
      }else{ fallback(null); }
    }catch(e){
      alert('画像の作成に失敗しました: '+(e&&e.message||e));
      if(btn){btn.disabled=false;btn.innerHTML=label;}
    }
  };
})();
</script>

<script>
/* =====================================================
   縦を1画面に収める（行の高さを自動計算）／横はスクロール可
===================================================== */
(function(){
  function els(){return {
    hd:document.querySelector('header'),
    hint:document.querySelector('.hintbar'),
    tw:document.querySelector('.table-wrap'),
    tb:document.getElementById('tBody'),
    bs:document.querySelector('.bottom-section'),
    thead:document.querySelector('.table-wrap thead')
  };}
  function fit(){
    var e=els(); if(!e.tw||!e.tb||!e.hd) return;
    var rows=[].slice.call(e.tb.querySelectorAll('tr')).filter(function(t){return !t.classList.contains('rh');}).length;
    if(!rows) return;
    var st=document.documentElement.style;
    function apply(rh){
      st.setProperty('--rowH',rh+'px');
      st.setProperty('--chip',Math.max(6.5,Math.min(11,Math.round(rh*0.34*10)/10))+'px');
      st.setProperty('--nameF',Math.max(8.5,Math.min(13,Math.round(rh*0.42*10)/10))+'px');
      st.setProperty('--dayW',(rh<20?28:rh<24?30:rh<28?32:34)+'px');
      document.body.classList.toggle('tiny',rh<26);
    }
    /* まず理論値で当たりをつける */
    apply(30);
    var headH=e.thead?e.thead.offsetHeight:30;
    var bsH=e.bs?e.bs.offsetHeight:0;
    var hintH=e.hint?e.hint.offsetHeight:0;
    var VH=(window.visualViewport&&window.visualViewport.height)?window.visualViewport.height:window.innerHeight;
    var RES=document.body.classList.contains('inapp')?96:6;   // X等の下部バー分を確保
    var rh=Math.floor((VH-e.hd.offsetHeight-hintH-bsH-headH-RES)/rows);
    rh=Math.max(15,Math.min(34,isFinite(rh)?rh:26));
    apply(rh);
    /* 実際の高さを見て、収まるまで1pxずつ詰める（最大18回） */
    for(var i=0;i<18;i++){
      if(document.documentElement.scrollHeight<=VH-RES+6) break;
      if(rh<=15) break;
      rh--; apply(rh);
    }
    /* それでも溢れる時はイベント欄を縮める */
    if(e.bs && document.documentElement.scrollHeight>VH-RES+6){
      var over=document.documentElement.scrollHeight-(VH-RES);
      e.bs.style.maxHeight=Math.max(40,e.bs.offsetHeight-over-4)+'px';
      e.bs.style.overflow='hidden';
    } else if(e.bs){ e.bs.style.maxHeight=''; }
  }
  window.__fitShift=fit;
  var tb=document.getElementById('tBody');
  if(tb&&window.MutationObserver){ new MutationObserver(function(){requestAnimationFrame(fit);}).observe(tb,{childList:true}); }
  window.addEventListener('resize',function(){requestAnimationFrame(fit);});
  if(window.visualViewport){ window.visualViewport.addEventListener('resize',function(){requestAnimationFrame(fit);}); }
  window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  document.addEventListener('click',function(e){ if(e.target.closest('.ftab')||e.target.closest('.nav-btn')) setTimeout(fit,80); });
  window.addEventListener('load',function(){setTimeout(fit,150);});
  setTimeout(fit,120); setTimeout(fit,900); setTimeout(fit,2000);
})();
</script>
